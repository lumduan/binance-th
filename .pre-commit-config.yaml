repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # These MIRROR the declared minimums in pyproject.toml [project].dependencies --
        # they are not "current" versions and must not be bumped to whatever uv.lock
        # happens to hold. Raising them makes this file assert a higher supported floor
        # than the package actually promises. Dependabot proposed exactly that in #26;
        # it is now blocked by an `ignore` list on the pre-commit ecosystem in
        # .github/dependabot.yml. Update these only when pyproject's floors change.
        additional_dependencies:
          - httpx>=0.27
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - websockets>=13.0
        args: [--strict]
        files: ^binance_th/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
