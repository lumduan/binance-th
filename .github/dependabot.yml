# Keeps the two things that silently rot until CI goes red on a Monday morning: the
# GitHub Actions runtimes (the Node 20 -> Node 24 deprecation surfaced only as a warning
# annotation on every run) and uv.lock (a `cryptography` / `pip` advisory held the weekly
# security scan red for three runs before anyone looked). Grouped to keep this to two PRs.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
