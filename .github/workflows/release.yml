name: Release

# On a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`): build the sdist +
# wheel and cut a GitHub Release with them attached.
#
# PyPI publishing is done separately via `scripts/publish.sh` (token-based) — this workflow
# does NOT publish to PyPI, so it needs no PyPI trusted-publisher setup or secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: Check artifacts
        run: uvx twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
