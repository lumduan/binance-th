name: Release

# Publishes to PyPI on a version tag (e.g. `git tag v1.0.0 && git push --tags`).
# Publishing uses PyPI Trusted Publishing (OIDC) — configure the trusted publisher for
# this repo/workflow on PyPI once before the first release. The `build` job validates the
# artifact with no secrets and runs regardless.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: Check artifacts
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing (OIDC) — no API token needed
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # idempotent if a version was already uploaded via scripts/publish.sh
          skip-existing: true
